services:
  thinkvelocity:
    build: .
    image: thinkvelocity-backend:local
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: ${PORT:-8000}
      STORAGE_PATH: /data
      ENABLE_REMOTE_TEST_RUNNER: ${ENABLE_REMOTE_TEST_RUNNER:-false}
    volumes:
      - thinkvelocity-data:/data
    restart: unless-stopped

volumes:
  thinkvelocity-data:
