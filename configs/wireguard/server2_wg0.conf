# =============================================================================
# WireGuard Config — Server 2 (velocity-prod-large) — HUB
# Public IP  : 13.203.181.76
# WireGuard IP: 10.100.0.1/24
# OS         : AlmaLinux (ec2-user)
# Role       : Hub — runs PostgreSQL + Redis, accepts peers from Servers 1 & 3
# =============================================================================
# BEFORE DEPLOYING:
#   Replace REPLACE_WITH_SERVER2_PRIVATE_KEY with contents of server2_private
#   Replace REPLACE_WITH_SERVER1_PUBLIC_KEY  with contents of server1_public
#   Replace REPLACE_WITH_SERVER3_PUBLIC_KEY  with contents of server3_public
# =============================================================================

[Interface]
PrivateKey = REPLACE_WITH_SERVER2_PRIVATE_KEY
Address = 10.100.0.1/24
ListenPort = 51820
# NAT/forwarding rules so peers can route through this hub
PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

[Peer]
# Server 1 — python-velocity-v1 (ubuntu@13.234.212.59)
PublicKey = REPLACE_WITH_SERVER1_PUBLIC_KEY
AllowedIPs = 10.100.0.2/32

[Peer]
# Server 3 — enterprise (ubuntu@13.233.86.137)
PublicKey = REPLACE_WITH_SERVER3_PUBLIC_KEY
AllowedIPs = 10.100.0.3/32
