# =============================================================================
# Nginx: enterprise.thinkvelocity.in — Enterprise Product (Consolidated Server)
# Serves:
#   /frontend/ → Enterprise React static from /var/www/enterprise
#   /backend/  → NestJS enterprise backend :3000
#   /prompt/   → Python AI unified :8005 (/prompt/ namespace)
#
# SOC2: CC6.6 (TLS), CC6.3 (enterprise backend is isolated on app_enterprise DB user)
# =============================================================================

server {
    listen 80;
    server_name enterprise.thinkvelocity.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name enterprise.thinkvelocity.in;

    client_max_body_size 100M;

    ssl_certificate     /etc/letsencrypt/live/enterprise.thinkvelocity.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enterprise.thinkvelocity.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy (SOC2 CC6.6 — XSS mitigation)
    # Enterprise React SPA — similar shape to consumer but scoped to enterprise domain.
    # unsafe-inline required by Create React App / Vite for runtime style injection.
    add_header Content-Security-Policy "default-src 'self' https://enterprise.thinkvelocity.in; script-src 'self' 'unsafe-inline' https://enterprise.thinkvelocity.in; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://enterprise.thinkvelocity.in https://api.thinkvelocity.in; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;

    server_tokens off;

    access_log /var/log/nginx/enterprise-access.log combined;
    error_log  /var/log/nginx/enterprise-error.log warn;

    # Root → frontend
    location = / {
        return 301 https://$host/frontend/;
    }
    location = /frontend {
        return 301 https://$host/frontend/;
    }

    # ==========================================================================
    # ENTERPRISE REACT FRONTEND — static build
    # Deploy: copy React build output → /var/www/enterprise/
    # ==========================================================================
    location /frontend/ {
        alias /var/www/enterprise/;
        try_files $uri $uri/ /frontend/index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location /frontend/static/ {
        alias /var/www/enterprise/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ==========================================================================
    # NESTJS ENTERPRISE BACKEND
    # ==========================================================================
    location /backend/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SameSite=Strict on refresh-token cookie (SOC2 CC6.2)
        proxy_cookie_flags ~ "SameSite=Strict; Secure; HttpOnly";

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ==========================================================================
    # PYTHON AI — /prompt/ namespace (enterprise prompt enhance/refine)
    # ==========================================================================
    location /prompt/ {
        proxy_pass http://127.0.0.1:8005/prompt/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming support
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        access_log off;
        return 200 '{"status":"ok","service":"enterprise-nginx"}';
        add_header Content-Type application/json;
    }
}
