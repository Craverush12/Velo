# =============================================================================
# thinkvelocity.in.conf — Consumer product vhost
# Server : thinkvelocity-prod-v2 (8GB Lightsail, Ubuntu 24.04)
# Serves :
#   /                    NextJS static export from /var/www/velocity (SPA)
#   /backend/            Node.js consumer backend  → 127.0.0.1:3005
#   /ai/enhance/stream   Python AI enhance SSE     → 127.0.0.1:8005  (explicit SSE)
#   /ai/                 Python AI unified         → 127.0.0.1:8005/ai/  (SSE)
#   /context/            Python AI unified         → 127.0.0.1:8005/context/
#
# Deploy:
#   sudo ln -s /opt/deploy/thinkvelocity/configs/prod/nginx/thinkvelocity.in.conf \
#              /etc/nginx/sites-enabled/thinkvelocity.in.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# SOC2: CC6.6 (TLS-only, security headers, no stack exposure), CC6.1 (gzip)
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP — redirect to HTTPS + pass ACME challenge through for certbot
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name thinkvelocity.in www.thinkvelocity.in;

    # ACME challenge pass-through (certbot --nginx or --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Everything else → HTTPS (301 permanent)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — main consumer domain
# certbot will insert SSL configuration here
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thinkvelocity.in www.thinkvelocity.in;

    # SSL managed by certbot
    # (certbot --nginx -d thinkvelocity.in -d www.thinkvelocity.in)

    server_tokens off;

    client_max_body_size 25m;

    # ── Security headers (SOC2 CC6.6) ───────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Logging (SOC2 PI1.1) ─────────────────────────────────────────────────
    access_log /var/log/nginx/thinkvelocity-access.log combined;
    error_log  /var/log/nginx/thinkvelocity-error.log warn;

    # ── Block sensitive paths ─────────────────────────────────────────────────
    location ~ /\.(git|env|htaccess|DS_Store) {
        deny all;
        return 404;
    }

    # =========================================================================
    # STATIC FRONTEND — NextJS static export (SPA mode)
    # Deploy: rsync -av out/ /var/www/velocity/
    # =========================================================================
    root /var/www/velocity;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }

    # NextJS versioned chunks — immutable, 1-year cache
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # =========================================================================
    # NODE.JS CONSUMER BACKEND
    # Strips /backend/ prefix before forwarding to :3005
    # =========================================================================
    location /backend/ {
        proxy_pass         http://127.0.0.1:3005/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffer_size  128k;
        proxy_buffers      4 256k;

        # Cookie hardening (SOC2 CC6.2)
        proxy_cookie_flags ~ "SameSite=Strict; Secure; HttpOnly";
    }

    # =========================================================================
    # EXPLICIT SSE BLOCK for /ai/enhance/stream
    # Must come before the catch-all /ai/ block (Nginx uses longest-prefix match).
    # Explicit SSE config: buffering off, cache off, chunked encoding on.
    # =========================================================================
    location /ai/enhance/stream {
        proxy_pass         http://127.0.0.1:8005/ai/enhance/stream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Explicit SSE configuration
        proxy_buffering           off;
        proxy_cache               off;
        proxy_request_buffering   off;
        add_header X-Accel-Buffering no;
        chunked_transfer_encoding on;

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }

    # =========================================================================
    # PYTHON AI — /ai/ namespace (enhance, refine, clarify, quality, media)
    # SSE streaming: proxy_buffering off is mandatory for LLM token-by-token output.
    # =========================================================================
    location /ai/ {
        proxy_pass         http://127.0.0.1:8005/ai/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }

    # =========================================================================
    # CONTEXT ENGINE — /context/ namespace (process-context, search, profile)
    # =========================================================================
    location /context/ {
        proxy_pass         http://127.0.0.1:8005/context/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }

    # =========================================================================
    # NGINX HEALTH CHECK (for deploy script — does not hit any container)
    # =========================================================================
    location = /health {
        access_log off;
        return 200 '{"status":"ok","service":"thinkvelocity-nginx"}';
        add_header Content-Type application/json;
    }
}
