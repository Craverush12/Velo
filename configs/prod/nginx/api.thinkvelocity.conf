# =============================================================================
# Nginx: api.thinkvelocity.in — Extension API
# Routes to: Extension FastAPI :8000
# Used by: Browser extension (Chrome/Firefox) for auth + enhance/refine
# SOC2: CC6.6 (TLS only), CC6.1 (rate limiting on auth)
# =============================================================================

server {
    listen 80;
    server_name api.thinkvelocity.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.thinkvelocity.in;

    ssl_certificate     /etc/letsencrypt/live/api.thinkvelocity.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.thinkvelocity.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Content-Security-Policy (SOC2 CC6.6)
    # API-only endpoint — no HTML/scripts served. Strict policy.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

    server_tokens off;

    client_max_body_size 10M;

    access_log /var/log/nginx/api-thinkvelocity-access.log combined;
    error_log  /var/log/nginx/api-thinkvelocity-error.log warn;

    # Extension API — all routes
    location / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming for AI responses
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Rate limit auth endpoints more aggressively
        limit_req zone=api_zone burst=10 nodelay;
    }

    # Auth endpoints — tighter rate limit (SOC2 CC6.2 brute force protection)
    # Matches RATE_LIMIT_AUTH_PER_MINUTE=5 in extension API env config.
    location ~ ^/(auth|login|register|token)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # auth_zone: 5 req/min, burst=3 (SOC2 CC6.2)
        limit_req zone=auth_zone burst=3 nodelay;

        # SameSite=Strict on refresh-token cookie (SOC2 CC6.2)
        proxy_cookie_flags ~ "SameSite=Strict; Secure; HttpOnly";
    }

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8000/health;
    }
}
