# =============================================================================
# logrotate-nginx.conf — Nginx access/error log rotation
# SOC2: PI1.1 — 90-day log retention
#
# DEPLOY:
#   sudo cp logrotate-nginx.conf /etc/logrotate.d/nginx
#   sudo logrotate -d /etc/logrotate.d/nginx   # dry-run / verify
#   sudo logrotate -f /etc/logrotate.d/nginx   # force first rotation
#
# NOTE: This file replaces the default /etc/logrotate.d/nginx shipped by
# the nginx package. If the package re-installs the default, re-deploy.
# =============================================================================

/var/log/nginx/*.log {
    daily
    rotate 90
    compress
    delaycompress
    missingok
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        # Signal nginx to reopen log file descriptors without reloading config.
        if [ -f /var/run/nginx.pid ]; then
            kill -USR1 $(cat /var/run/nginx.pid)
        else
            nginx -s reopen
        fi
    endscript
}
