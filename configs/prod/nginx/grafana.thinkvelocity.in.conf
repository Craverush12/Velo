# =============================================================================
# grafana.thinkvelocity.in.conf — Internal observability dashboard vhost
# Server : thinkvelocity-prod-v2 (8GB Lightsail, Ubuntu 24.04)
# Routes : ALL traffic → Grafana at 127.0.0.1:3200
#
# ACCESS CONTROL (two layers):
#   Layer 1 — IP allowlist at vhost level (replace REPLACE_WITH_TEAM_IP_* below)
#   Layer 2 — HTTP Basic Auth ("ThinkVelocity Internal" realm)
#             htpasswd file: /etc/nginx/grafana.htpasswd
#             Create: sudo htpasswd -c /etc/nginx/grafana.htpasswd <username>
#
# This vhost must NEVER be publicly accessible.
# Grafana is bound to 127.0.0.1:3200 in the observability docker-compose
# (port 3200 avoids collision with NestJS enterprise backend on :3000).
#
# Deploy:
#   sudo ln -s /opt/deploy/thinkvelocity/configs/prod/nginx/grafana.thinkvelocity.in.conf \
#              /etc/nginx/sites-enabled/grafana.thinkvelocity.in.conf
#   sudo htpasswd -c /etc/nginx/grafana.htpasswd arjun
#   sudo nginx -t && sudo systemctl reload nginx
#
# SOC2: CC6.1 (IP allowlist), CC6.2 (basic auth second factor),
#       CC6.6 (TLS-only, security headers, no public observability port)
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP — redirect to HTTPS + ACME challenge pass-through
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name grafana.thinkvelocity.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — Grafana internal dashboard (port 443 only)
# certbot will insert SSL configuration here
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grafana.thinkvelocity.in;

    # SSL managed by certbot
    # (certbot --nginx -d grafana.thinkvelocity.in)

    server_tokens off;

    # ── IP Allowlist — Layer 1 access control (SOC2 CC6.1) ─────────────────
    # Replace placeholders with real team IPs. One "allow" per line.
    # Example:
    #   allow 203.0.113.10;    # Arjun home
    #   allow 198.51.100.20;   # Aniket office
    #   allow 192.0.2.30;      # VPN exit node
    satisfy all;
    allow REPLACE_WITH_TEAM_IP_1;
    deny all;

    # ── Security headers (SOC2 CC6.6) ───────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json;

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/grafana-access.log combined;
    error_log  /var/log/nginx/grafana-error.log warn;

    # =========================================================================
    # GRAFANA PROXY — all routes
    # Layer 2: HTTP Basic Auth at Nginx level (before request reaches Grafana).
    # WebSocket support: Grafana live dashboards and Loki log tail use WS.
    # =========================================================================
    location / {
        # Layer 2 — HTTP Basic Auth
        auth_basic           "ThinkVelocity Internal";
        auth_basic_user_file /etc/nginx/grafana.htpasswd;

        proxy_pass         http://127.0.0.1:3200/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (Grafana live updates, Loki log streaming)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;

        # Disable buffering so Grafana Loki live-tail works
        proxy_buffering off;
    }

    # =========================================================================
    # NGINX HEALTH — bypasses auth so the deploy script can ping it.
    # Grafana's own /api/health remains auth-gated.
    # =========================================================================
    location = /nginx-health {
        auth_basic off;
        access_log off;
        return 200 '{"status":"ok","service":"grafana-nginx"}';
        add_header Content-Type application/json;
    }
}
