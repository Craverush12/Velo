# =============================================================================
# Nginx: thinkvelocity.in — Consumer Product (Consolidated Server)
# Serves:
#   / → NextJS static export from /var/www/velocity
#   /backend-V1-D/ → Node.js consumer backend :3005
#   /python-backend-D/ → Python AI unified :8005 (/ai/ namespace)
#   /context-engine/ → Python AI unified :8005 (/context/ namespace)
#
# SOC2: CC6.6 (TLS only), security headers, no public backend ports
# =============================================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name thinkvelocity.in www.thinkvelocity.in;
    return 301 https://$host$request_uri;
}

# HTTPS — main consumer domain
server {
    listen 443 ssl http2;
    server_name thinkvelocity.in www.thinkvelocity.in;

    client_max_body_size 50M;

    # SSL — managed by certbot
    ssl_certificate     /etc/letsencrypt/live/thinkvelocity.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thinkvelocity.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (SOC2 CC6.6)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content-Security-Policy (SOC2 CC6.6 — XSS mitigation)
    # unsafe-inline required by NextJS for inline scripts/styles at runtime.
    # connect-src allows extension calls to api.thinkvelocity.in.
    # font-src allows Google Fonts.
    add_header Content-Security-Policy "default-src 'self' https://thinkvelocity.in https://www.thinkvelocity.in; script-src 'self' 'unsafe-inline' https://thinkvelocity.in https://www.thinkvelocity.in; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.thinkvelocity.in https://thinkvelocity.in https://www.thinkvelocity.in; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;

    # Remove server banner (SOC2 CC6.6 — don't expose stack)
    server_tokens off;

    # Access logs (SOC2 PI1.1)
    access_log /var/log/nginx/thinkvelocity-access.log combined;
    error_log  /var/log/nginx/thinkvelocity-error.log warn;

    # ==========================================================================
    # FRONTEND — NextJS static export
    # No container needed: Apache/Nginx serves files directly from disk
    # Deploy: rsync next build output → /var/www/velocity/
    # ==========================================================================
    root /var/www/velocity;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # NextJS RSC (React Server Components) data requests
    location ~* \.json$ {
        try_files $uri =404;
        expires 1m;
        add_header Cache-Control "public, max-age=60";
    }

    # Next.js _next directory — versioned builds, very long cache
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ==========================================================================
    # NODE.JS CONSUMER BACKEND
    # ==========================================================================
    # Auth endpoints — must appear before the broader /backend-V1-D/ block
    # so Nginx uses the more specific match (longest-prefix wins for location ~).
    # SOC2 CC6.2: tighter rate limit (5 req/min) on login/register/reset.
    location ~ ^/backend-V1-D/auth/(login|register|reset-password) {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Strict rate limit — 5 req/min, burst of 3 (SOC2 CC6.2)
        limit_req zone=auth_zone burst=3 nodelay;

        # SameSite=Strict on refresh-token cookie (SOC2 CC6.2)
        proxy_cookie_flags ~ "SameSite=Strict; Secure; HttpOnly";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location /backend-V1-D/ {
        proxy_pass http://127.0.0.1:3005/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Rate limiting (prevent brute force — SOC2 CC6.1)
        limit_req zone=api_zone burst=20 nodelay;

        # SameSite=Strict on refresh-token cookie (SOC2 CC6.2)
        proxy_cookie_flags ~ "SameSite=Strict; Secure; HttpOnly";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffer settings for webhook payloads
        proxy_buffer_size   128k;
        proxy_buffers       4 256k;
    }

    # ==========================================================================
    # PYTHON AI — /ai/ namespace (enhance, refine, playground)
    # ==========================================================================
    location /python-backend-D/ {
        proxy_pass http://127.0.0.1:8005/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming support (LLM responses)
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ==========================================================================
    # CONTEXT ENGINE — /context/ namespace
    # ==========================================================================
    location /context-engine/ {
        proxy_pass http://127.0.0.1:8005/context/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long timeout — context processing can take time
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ==========================================================================
    # HEALTH ENDPOINTS
    # ==========================================================================
    location = /health {
        access_log off;
        return 200 '{"status":"ok","service":"thinkvelocity-nginx"}';
        add_header Content-Type application/json;
    }

    # Restrict access to sensitive paths
    location ~ /\.(git|env|htaccess) {
        deny all;
        return 404;
    }
}

# =============================================================================
# Rate limiting zones are defined in configs/prod/nginx/rate-limits.conf.
# Deploy to /etc/nginx/conf.d/rate-limits.conf and include from nginx.conf.
# Zones in use: api_zone (30r/m), auth_zone (5r/m).
# =============================================================================
