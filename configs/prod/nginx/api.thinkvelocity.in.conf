# =============================================================================
# api.thinkvelocity.in.conf — Extension API vhost
# Server : thinkvelocity-prod-v2 (8GB Lightsail, Ubuntu 24.04)
# Routes : ALL traffic → extension FastAPI at 127.0.0.1:8000
#
# Used by:
#   - Chrome extension (enhance, refine, clarify, context, auth)
#   - MCP stdio server (Claude Desktop, Cursor)
#
# SSE streaming is used for /dev/test/enhance/stream and all enhance routes.
# proxy_buffering off is applied globally — every response is streamed through
# to avoid buffering LLM output mid-stream.
#
# Deploy:
#   sudo ln -s /opt/deploy/thinkvelocity/configs/prod/nginx/api.thinkvelocity.in.conf \
#              /etc/nginx/sites-enabled/api.thinkvelocity.in.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# SOC2: CC6.6 (TLS-only, security headers, no public backend port)
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP — redirect to HTTPS + ACME challenge pass-through
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.thinkvelocity.in;

    # ACME challenge pass-through (certbot --nginx or --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Everything else → HTTPS (301 permanent)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — Extension API
# certbot will insert SSL configuration here
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.thinkvelocity.in;

    # SSL managed by certbot
    # (certbot --nginx -d api.thinkvelocity.in)

    server_tokens off;

    client_max_body_size 25m;

    # ── Security headers (SOC2 CC6.6) ───────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json;

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/api-thinkvelocity-access.log combined;
    error_log  /var/log/nginx/api-thinkvelocity-error.log warn;

    # ── Block sensitive paths ─────────────────────────────────────────────────
    location ~ /\.(git|env|htaccess) {
        deny all;
        return 404;
    }

    # =========================================================================
    # EXTENSION API — all routes proxied to FastAPI :8000
    # proxy_buffering off is required for SSE (enhance/stream).
    # proxy_read_timeout 300s supports long-running LLM completions.
    # =========================================================================
    location / {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }

    # =========================================================================
    # NGINX HEALTH CHECK (does not hit the container — deploy-script ping target)
    # =========================================================================
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }
}
