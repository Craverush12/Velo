# =============================================================================
# rate-limits.conf — Nginx shared rate-limiting zones
# SOC2: CC6.2 (auth brute-force protection), CC6.1 (API abuse prevention)
#
# HOW TO DEPLOY:
#   1. Copy or symlink this file into /etc/nginx/conf.d/rate-limits.conf
#      OR paste the directives directly into the http {} block of
#      /etc/nginx/nginx.conf — before any server {} includes.
#
#   2. In /etc/nginx/nginx.conf, inside the http {} block, add:
#        include /etc/nginx/conf.d/rate-limits.conf;
#
#   3. Test and reload:
#        nginx -t && nginx -s reload
#
# ZONE REFERENCE:
#   api_zone   — general API calls (30 req/min). Used by /backend-V1-D/ and
#                the default location in api.thinkvelocity.conf.
#   auth_zone  — sensitive auth paths (5 req/min). Used by login, register,
#                reset-password, and extension auth/* endpoints.
#   ext_zone   — extension-specific routes (30 req/min), separate accounting
#                so extension bursts don't eat consumer API headroom.
#   conn_limit — concurrent connection cap per IP (paired with limit_conn in
#                server blocks as needed; not applied globally here).
# =============================================================================

# General API zone — 30 requests per minute per IP
limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=30r/m;

# Auth zone — 5 requests per minute per IP (CC6.2 brute-force prevention)
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;

# Extension API zone — same rate as api_zone, tracked separately
limit_req_zone $binary_remote_addr zone=ext_zone:10m  rate=30r/m;

# Concurrent connection limit zone (use with limit_conn in server blocks)
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Default response code when a limit is exceeded (429 Too Many Requests)
limit_req_status  429;
limit_conn_status 429;
