# =============================================================================
# enterprise.thinkvelocity.in.conf — Enterprise product vhost
# Server : thinkvelocity-prod-v2 (8GB Lightsail, Ubuntu 24.04)
# Serves :
#   /           → Enterprise React SPA from /var/www/enterprise
#   /frontend/  → Same React SPA (/var/www/enterprise — legacy path alias)
#   /backend/   → NestJS enterprise backend  → 127.0.0.1:3000
#   /ai/        → Python AI unified          → 127.0.0.1:8005/ai/  (SSE)
#
# client_max_body_size 25m: enterprise uploads compliance docs and policy files.
#
# Deploy:
#   sudo ln -s /opt/deploy/thinkvelocity/configs/prod/nginx/enterprise.thinkvelocity.in.conf \
#              /etc/nginx/sites-enabled/enterprise.thinkvelocity.in.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# SOC2: CC6.6 (TLS, security headers), CC6.2 (JWT isolation — different from consumer)
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP — redirect to HTTPS + ACME challenge pass-through
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name enterprise.thinkvelocity.in;

    # ACME challenge pass-through (certbot --nginx or --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Everything else → HTTPS (301 permanent)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — Enterprise domain
# certbot will insert SSL configuration here
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name enterprise.thinkvelocity.in;

    # SSL managed by certbot
    # (certbot --nginx -d enterprise.thinkvelocity.in)

    server_tokens off;

    client_max_body_size 25m;

    # ── Security headers (SOC2 CC6.6) ───────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/enterprise-access.log combined;
    error_log  /var/log/nginx/enterprise-error.log warn;

    # ── Block sensitive paths ─────────────────────────────────────────────────
    location ~ /\.(git|env|htaccess|DS_Store) {
        deny all;
        return 404;
    }

    # =========================================================================
    # ENTERPRISE REACT FRONTEND — static build (root path)
    # Deploy: rsync -av dist/ /var/www/enterprise/
    # SPA fallback: any unknown path returns index.html.
    # =========================================================================
    root /var/www/enterprise;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }

    # /frontend/ — serves /var/www/enterprise/ (legacy path alias for extension code)
    location /frontend/ {
        alias /var/www/enterprise/;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Versioned build assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # =========================================================================
    # NESTJS ENTERPRISE BACKEND
    # Strips /backend/ prefix before forwarding to :3000.
    # =========================================================================
    location /backend/ {
        proxy_pass         http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Cookie hardening (SOC2 CC6.2)
        proxy_cookie_flags ~ "SameSite=Strict; Secure; HttpOnly";

        proxy_connect_timeout  10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffer_size  256k;
        proxy_buffers      4 512k;
    }

    # =========================================================================
    # PYTHON AI — /ai/ namespace (enterprise uses same python-ai-unified :8005)
    # Guardrail-checked enhance requests arrive here via SSE streaming.
    # =========================================================================
    location /ai/ {
        proxy_pass         http://127.0.0.1:8005/ai/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }

    # =========================================================================
    # NGINX HEALTH
    # =========================================================================
    location = /health {
        access_log off;
        return 200 '{"status":"ok","service":"enterprise-nginx"}';
        add_header Content-Type application/json;
    }
}
