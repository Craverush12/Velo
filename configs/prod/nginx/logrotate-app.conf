# =============================================================================
# logrotate-app.conf — ThinkVelocity application log rotation
# SOC2: PI1.1 — 90-day log retention for application-level logs
#
# DEPLOY:
#   sudo cp logrotate-app.conf /etc/logrotate.d/thinkvelocity-app
#   sudo mkdir -p /var/log/thinkvelocity
#   sudo logrotate -d /etc/logrotate.d/thinkvelocity-app   # dry-run / verify
#   sudo logrotate -f /etc/logrotate.d/thinkvelocity-app   # force first rotation
#
# Application containers that write to these paths must mount the host
# /var/log/thinkvelocity directory as a volume:
#   volumes:
#     - /var/log/thinkvelocity:/var/log/thinkvelocity
#
# After rotation, SIGUSR1 is sent to each container so it can reopen its
# log file descriptors without a full restart. Containers that do not handle
# SIGUSR1 can use a HUP signal or be restarted via `docker restart`.
# =============================================================================

/var/log/thinkvelocity/*.log {
    daily
    rotate 90
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root adm
    sharedscripts
    postrotate
        # Send SIGUSR1 to each ThinkVelocity container that uses these log files.
        # The container names below must match those in docker-compose.prod.yml.
        for container in thinkvelocity-api thinkvelocity-consumer thinkvelocity-enterprise thinkvelocity-ai; do
            if docker ps --format '{{.Names}}' | grep -q "^${container}$"; then
                docker kill --signal=SIGUSR1 "${container}" || true
            fi
        done
    endscript
}
