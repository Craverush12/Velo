# Nginx virtual host for metrics.thinkvelocity.in
# Proxies to Grafana running on 127.0.0.1:3200
#
# Prerequisites:
#   1. DNS A record: metrics.thinkvelocity.in -> 13.203.181.76 (Server 2)
#   2. SSL: certbot --nginx -d metrics.thinkvelocity.in
#   3. Basic auth: htpasswd -c /etc/nginx/.htpasswd <admin-username>
#      OR replace the auth block with an IP allowlist (see below)
#
# Deploy location: /etc/nginx/conf.d/metrics.thinkvelocity.in.conf
# After placing: nginx -t && systemctl reload nginx

# -------------------------------------------------------------------------
# HTTP → HTTPS redirect
# -------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name metrics.thinkvelocity.in;

    # Allow certbot ACME challenges through before redirect
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------------------------
# HTTPS — proxy to Grafana
# -------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name metrics.thinkvelocity.in;

    # ------------------------------------------------------------------
    # SSL — managed by Certbot (do NOT edit these lines manually)
    # Run: certbot --nginx -d metrics.thinkvelocity.in
    # ------------------------------------------------------------------
    # ssl_certificate     /etc/letsencrypt/live/metrics.thinkvelocity.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/metrics.thinkvelocity.in/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    # ------------------------------------------------------------------

    # ------------------------------------------------------------------
    # Access control — CHOOSE ONE approach and uncomment it:
    # ------------------------------------------------------------------

    # OPTION A: HTTP Basic Auth (simple, works everywhere)
    # auth_basic           "ThinkVelocity Metrics";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # OPTION B: IP allowlist (replace with your team's IPs)
    # allow 203.0.113.10;   # Office IP — REPLACE
    # allow 198.51.100.20;  # VPN exit node — REPLACE
    # allow 10.100.0.0/24;  # WireGuard subnet
    # deny  all;

    # OPTION C: Both (recommended for production)
    # allow 203.0.113.10;
    # allow 10.100.0.0/24;
    # deny  all;
    # auth_basic           "ThinkVelocity Metrics";
    # auth_basic_user_file /etc/nginx/.htpasswd;
    # ------------------------------------------------------------------

    location / {
        proxy_pass         http://127.0.0.1:3200;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for Grafana live features (WebSocket)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout    300;
        proxy_connect_timeout 300;
        proxy_send_timeout    300;

        # Increase buffer sizes for Grafana dashboard responses
        proxy_buffer_size        128k;
        proxy_buffers            4 256k;
        proxy_busy_buffers_size  256k;
    }

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Deny access to Grafana's built-in registration/invite (belt-and-suspenders)
    location /api/admin/users {
        return 403;
    }

    access_log /var/log/nginx/metrics.thinkvelocity.in-access.log;
    error_log  /var/log/nginx/metrics.thinkvelocity.in-error.log;
}
