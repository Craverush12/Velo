auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

# =============================================================================
# Common — paths and single-node ring
# =============================================================================
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

# =============================================================================
# Schema — v12 with TSDB (recommended for Loki 2.8+)
# =============================================================================
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v12
      index:
        prefix: index_
        period: 24h

# =============================================================================
# Storage — local filesystem (no S3 dependency)
# =============================================================================
storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-shipper-active
    cache_location: /loki/tsdb-shipper-cache
    cache_ttl: 24h
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks

# =============================================================================
# Ingester — WAL enabled for crash recovery
# =============================================================================
ingester:
  wal:
    enabled: true
    dir: /loki/wal
    flush_on_shutdown: true
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 1h
  chunk_target_size: 1572864   # 1.5 MB
  chunk_retain_period: 30s
  max_transfer_retries: 0
  wal_flush_on_shutdown: true

# =============================================================================
# Compactor — handles index compaction and retention enforcement
# =============================================================================
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 10
  delete_request_store: filesystem

# =============================================================================
# Limits — 90-day retention for SOC2 A1.2 / PI1.1 audit trail
# =============================================================================
limits_config:
  # 90 days = 2160 hours
  retention_period: 2160h
  reject_old_samples: true
  reject_old_samples_max_age: 168h   # 7 days
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64
  max_streams_per_user: 10000
  max_global_streams_per_user: 50000
  max_entries_limit_per_query: 10000
  max_query_series_limit: 10000
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 15MB

# =============================================================================
# Query range — embedded cache to reduce re-computation cost
# =============================================================================
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 150

# =============================================================================
# Ruler — optional log-based alerting (forwarded to Alertmanager)
# =============================================================================
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true

# =============================================================================
# Analytics — opt out of Grafana telemetry
# =============================================================================
analytics:
  reporting_enabled: false
