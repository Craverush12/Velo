server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /run/promtail/positions.yaml

# =============================================================================
# Loki endpoint — internal Docker network
# =============================================================================
clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: thinkvelocity
    batchwait: 1s
    batchsize: 1048576   # 1 MB
    timeout: 10s
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

# =============================================================================
# Scrape configurations
# =============================================================================
scrape_configs:

  # ---------------------------------------------------------------------------
  # Docker container logs
  # Reads from /var/lib/docker/containers/*/*-json.log (Docker JSON log driver)
  # ---------------------------------------------------------------------------
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: status
            values: [running]
    relabel_configs:
      # Extract the container name (strip leading /)
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container_name
      # Map Docker Compose service label to a `service` label
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      # Map Docker Compose project label to `app`
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: app
      # Keep the container ID for correlation with cAdvisor
      - source_labels: [__meta_docker_container_id]
        target_label: container_id
      # Static environment label
      - target_label: environment
        replacement: production
      # Drop containers with no name (edge case)
      - source_labels: [container_name]
        regex: ".+"
        action: keep
    pipeline_stages:
      # Decode Docker's JSON log wrapper: {"log":"...","stream":"...","time":"..."}
      - docker: {}
      # Try to parse the inner log value as JSON (structured logging from apps)
      - json:
          expressions:
            level: level
            msg: msg
            message: message
            error: error
            request_id: request_id
            status_code: status_code
            duration_ms: duration_ms
          source: log
      # If the inner message has a `level` field, promote it to a label
      - labels:
          level:
          status_code:
      # Normalise level values to lowercase
      - replace:
          expression: "(ERROR|WARN|INFO|DEBUG)"
          replace: '{{ ToLower .Value }}'
          source: level
      # Drop debug-level logs to save storage (remove this line to keep all)
      - drop:
          expression: "debug"
          source: level
          drop_counter_reason: debug_logs_suppressed

  # ---------------------------------------------------------------------------
  # System journal — kernel and systemd unit logs
  # Useful for OOM kills, disk errors, SSH events (SOC2 PI1.1)
  # ---------------------------------------------------------------------------
  - job_name: systemd-journal
    journal:
      max_age: 12h
      json: true
      path: /var/log/journal
      labels:
        job: systemd-journal
        environment: production
    relabel_configs:
      - source_labels: [__journal__systemd_unit]
        target_label: unit
      - source_labels: [__journal__hostname]
        target_label: hostname
      - source_labels: [__journal_priority_keyword]
        target_label: priority
    pipeline_stages:
      - json:
          expressions:
            message: MESSAGE
            unit: _SYSTEMD_UNIT
      - labels:
          unit:

  # ---------------------------------------------------------------------------
  # Nginx access log — for HTTP request audit trail (SOC2 PI1.1)
  # ---------------------------------------------------------------------------
  - job_name: nginx-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          log_type: access
          environment: production
          __path__: /var/log/nginx/*access*.log
    pipeline_stages:
      - regex:
          expression: >-
            ^(?P<remote_addr>\S+)\s-\s(?P<remote_user>\S+)\s\[(?P<time_local>[^\]]+)\]\s
            "(?P<method>\S+)\s(?P<path>\S+)\s(?P<protocol>[^"]+)"\s
            (?P<status>\d+)\s(?P<body_bytes_sent>\d+)\s
            "(?P<http_referer>[^"]*)"\s"(?P<http_user_agent>[^"]*)"
      - labels:
          method:
          status:
      - timestamp:
          source: time_local
          format: "02/Jan/2006:15:04:05 -0700"

  # ---------------------------------------------------------------------------
  # PostgreSQL logs — query errors and slow queries (SOC2 PI1.1)
  # ---------------------------------------------------------------------------
  - job_name: postgresql
    static_configs:
      - targets:
          - localhost
        labels:
          job: postgresql
          service: postgres
          environment: production
          __path__: /var/lib/postgresql/data/log/*.log
    pipeline_stages:
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2}'
          max_wait_time: 3s
