# =============================================================================
# Nginx virtual host — grafana.thinkvelocity.in
# Proxies HTTPS traffic to Grafana on 127.0.0.1:3000 (Docker, internal only)
#
# Deploy location: /etc/nginx/conf.d/grafana.thinkvelocity.in.conf
# After placing:   nginx -t && systemctl reload nginx
#
# SSL: certbot --nginx -d grafana.thinkvelocity.in
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name grafana.thinkvelocity.in;

    # Allow ACME challenges through before redirect (certbot needs this)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — IP-restricted proxy to Grafana
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grafana.thinkvelocity.in;

    # ------------------------------------------------------------------
    # SSL — managed by Certbot. Run:
    #   certbot --nginx -d grafana.thinkvelocity.in
    # Certbot will uncomment/add these lines automatically.
    # ------------------------------------------------------------------
    # ssl_certificate     /etc/letsencrypt/live/grafana.thinkvelocity.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/grafana.thinkvelocity.in/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    # ------------------------------------------------------------------

    # ------------------------------------------------------------------
    # IP allowlist — ONLY Arjun's office IP may access Grafana.
    # Replace REPLACE_WITH_OFFICE_IP with the actual static egress IP.
    # To find your current IP: curl -s https://ifconfig.me
    # ------------------------------------------------------------------
    allow REPLACE_WITH_OFFICE_IP;   # Arjun's office / home static IP
    allow 127.0.0.1;                # localhost (health checks)
    deny  all;
    # ------------------------------------------------------------------

    # ------------------------------------------------------------------
    # Proxy to Grafana (Docker container bound to 127.0.0.1:3000)
    # ------------------------------------------------------------------
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support — required for Grafana Live (real-time panels)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout    300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;

        # Buffer sizes for large dashboard JSON responses
        proxy_buffer_size        128k;
        proxy_buffers            4 256k;
        proxy_busy_buffers_size  256k;
    }

    # ------------------------------------------------------------------
    # Block Grafana admin API endpoints from external callers
    # (belt-and-suspenders on top of the IP allowlist)
    # ------------------------------------------------------------------
    location /api/admin/ {
        return 403;
    }

    location /api/user/password {
        return 403;
    }

    # ------------------------------------------------------------------
    # Security headers
    # ------------------------------------------------------------------
    add_header X-Frame-Options        "SAMEORIGIN"                  always;
    add_header X-Content-Type-Options "nosniff"                     always;
    add_header X-XSS-Protection       "1; mode=block"               always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ------------------------------------------------------------------
    # Logs
    # ------------------------------------------------------------------
    access_log /var/log/nginx/grafana.thinkvelocity.in-access.log combined;
    error_log  /var/log/nginx/grafana.thinkvelocity.in-error.log  warn;
}
