apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: "15s"
    editable: true

  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    access: proxy
    isDefault: false
    jsonData:
      maxLines: 5000
      timeout: 60
      derivedFields:
        # Link request_id log label to a Tempo trace (if Tempo is added later)
        - matcherRegex: '"request_id":"(\w+)"'
          name: request_id
          url: ""
    editable: true
