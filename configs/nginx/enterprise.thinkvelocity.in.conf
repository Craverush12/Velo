# =============================================================================
# Nginx vHost: enterprise.thinkvelocity.in — Enterprise Product (Server 3)
# Task: T-038 — Enterprise domain migration
#
# DEPLOY STEPS:
#   1. T-007: Assign Elastic IP to Server 3 first (prerequisite)
#   2. Update DNS: enterprise.thinkvelocity.in A → <Server3-Elastic-IP>
#   3. Copy this file to /etc/nginx/conf.d/enterprise-thinkvelocity.conf on Server 3
#   4. sudo nginx -t
#   5. certbot --nginx -d enterprise.thinkvelocity.in
#   6. sudo systemctl reload nginx
#   7. Update NestJS ALLOWED_ORIGINS in .env (see comment below)
#   8. After 6-month redirect period: let velocityenterprise.toteminteractive.in expire
# =============================================================================

# HTTP redirect for new domain
server {
    listen 80;
    server_name enterprise.thinkvelocity.in;
    return 301 https://$host$request_uri;
}

# HTTPS — new canonical domain
server {
    listen 443 ssl;
    server_name enterprise.thinkvelocity.in;
    client_max_body_size 100M;

    # SSL — filled in by certbot after step 5 above
    # ssl_certificate     /etc/letsencrypt/live/enterprise.thinkvelocity.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/enterprise.thinkvelocity.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ROOT → FRONTEND redirect
    location = / {
        return 301 https://$host/frontend/;
    }
    location = /frontend {
        return 301 https://$host/frontend/;
    }

    # FRONTEND (React — velocity-frontend container on 127.0.0.1:8081)
    location /frontend/ {
        proxy_pass http://127.0.0.1:8081/frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BACKEND API (NestJS — enterprise-backend container on 127.0.0.1:3000)
    location /backend/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support (NestJS may use WS for some features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # AI / Prompt Enhance (FastAPI — prompt-enhance container on 127.0.0.1:3002)
    location /prompt/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming support
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

