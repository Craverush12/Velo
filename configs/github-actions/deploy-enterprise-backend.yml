name: Deploy Enterprise Backend (NestJS)

on:
  push:
    branches: [main]
    paths:
      - 'enterprise/**'
      - 'package*.json'
      - '.github/workflows/deploy-enterprise-backend.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual trigger'

env:
  IMAGE_NAME: thinkvelocity24/thinkvelocity-enterprise-backend
  SERVER3_HOST: 13.233.86.137
  SERVER3_USER: ubuntu
  HEALTH_URL: http://localhost:3000/health

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit dependencies (fail on HIGH+)
        run: npm audit --audit-level=high

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'

      - name: Upload filesystem scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-filesystem'

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [security-scan]
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-image-results.sarif'

      - name: Upload image scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-image'

  deploy:
    name: Deploy to Production (Server 3)
    runs-on: ubuntu-latest
    needs: [build]
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER3_HOST }}
          username: ${{ env.SERVER3_USER }}
          key: ${{ secrets.SERVER3_SSH_KEY }}
          script: |
            /opt/deploy/deploy.sh enterprise-backend ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.HEALTH_URL }}

      - name: Notify Slack — success
        if: success()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            -d '{
              "text": "✅ *enterprise-backend deployed to production (Server 3)*\nCommit: `${{ github.sha }}`\nActor: ${{ github.actor }}\nRef: ${{ github.ref_name }}"
            }'

      - name: Notify Slack — failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            -d '{
              "text": "🚨 *enterprise-backend deploy FAILED (Server 3)*\nCommit: `${{ github.sha }}`\nActor: ${{ github.actor }}\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
