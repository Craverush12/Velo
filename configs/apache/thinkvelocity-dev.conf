# =============================================================================
# Apache vHost: dev.thinkvelocity.in — Internal Development Access
# Deploy to: /etc/httpd/conf.d/thinkvelocity-dev.conf  (Server 2)
# After deploying:
#   certbot --apache -d dev.thinkvelocity.in
#   sudo systemctl reload httpd
# =============================================================================
# IMPORTANT: Replace <YOUR_OFFICE_IP> and <YOUR_HOME_IP> with real IPs.
# Leave the Require ip lines empty to block everyone initially, then add IPs.
# =============================================================================

# HTTP → HTTPS redirect
<VirtualHost *:80>
    ServerName dev.thinkvelocity.in
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName dev.thinkvelocity.in

    # SSL — filled in by certbot
    SSLEngine on
    # SSLCertificateFile /etc/letsencrypt/live/dev.thinkvelocity.in/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/dev.thinkvelocity.in/privkey.pem

    # =========================================================================
    # IP ALLOWLIST — Only team IPs can reach this subdomain.
    # Add your office IP and team members' home IPs.
    # =========================================================================
    <Location "/">
        Require ip REPLACE_WITH_OFFICE_IP
        Require ip REPLACE_WITH_HOME_IP_1
        # Require ip REPLACE_WITH_HOME_IP_2
    </Location>

    ProxyPreserveHost On
    ProxyRequests Off

    # Dev Python AI backend (port 8006)
    <Location "/dev/test/">
        Require ip REPLACE_WITH_OFFICE_IP
        Require ip REPLACE_WITH_HOME_IP_1
    </Location>
    ProxyPass /dev/test/ http://127.0.0.1:8006/
    ProxyPassReverse /dev/test/ http://127.0.0.1:8006/

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/dev/test/(.*)$ ws://127.0.0.1:8006/$1 [P,L]

    # Dev Node.js backend (port 3006)
    <Location "/dev/node/">
        Require ip REPLACE_WITH_OFFICE_IP
        Require ip REPLACE_WITH_HOME_IP_1
    </Location>
    ProxyPass /dev/node/ http://127.0.0.1:3006/
    ProxyPassReverse /dev/node/ http://127.0.0.1:3006/

    # Logs
    ErrorLog /var/log/httpd/thinkvelocity-dev_error.log
    CustomLog /var/log/httpd/thinkvelocity-dev_access.log combined

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</VirtualHost>
