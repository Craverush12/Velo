# ==============================================================================
# pg_hba.conf — Hardened PostgreSQL Host-Based Authentication
# ThinkVelocity Production — Server 2 (10.100.0.1)
# Generated: 2026-05-25
#
# Deploy: sudo cp pg_hba.conf /var/lib/pgsql/17/data/pg_hba.conf
#         sudo chown postgres:postgres /var/lib/pgsql/17/data/pg_hba.conf
#         sudo chmod 600 /var/lib/pgsql/17/data/pg_hba.conf
#         sudo systemctl restart postgresql-17
#
# Format:
#   TYPE   DATABASE   USER   ADDRESS      METHOD   [OPTIONS]
# ==============================================================================

# ------------------------------------------------------------------------------
# LOCAL UNIX SOCKET CONNECTIONS
# Only the postgres OS user can connect via Unix socket (peer = OS user match).
# All other local Unix socket connection attempts are rejected immediately.
# ------------------------------------------------------------------------------

# Allow postgres superuser via Unix socket (peer = OS user must match)
local   all             postgres                                peer

# Allow replication via Unix socket for postgres superuser
local   replication     postgres                                peer

# Reject all other local Unix socket connections — no anonymous local access
local   all             all                                     reject

# ------------------------------------------------------------------------------
# LOCALHOST (127.0.0.1) — APPLICATION CONNECTIONS (no SSL required; loopback is secure)
# App services on Server 2 connect via 127.0.0.1.
# SSL is not required here because loopback traffic never leaves the host.
# scram-sha-256 is required for all password-based auth.
# ------------------------------------------------------------------------------

# app_consumer: reads/writes thinkvelocity_prod (Node.js backend, Python AI on Server 2)
host    thinkvelocity_prod  app_consumer    127.0.0.1/32         scram-sha-256

# app_readonly: read-only access to thinkvelocity_prod (reporting, analytics queries)
host    thinkvelocity_prod  app_readonly    127.0.0.1/32         scram-sha-256

# app_enterprise: reads/writes enterprise database (NestJS backend — Server 2 local)
host    enterprise          app_enterprise  127.0.0.1/32         scram-sha-256

# app_extension: reads/writes thinkvelocity_ext (extension API — Server 2 local)
host    thinkvelocity_ext   app_extension   127.0.0.1/32         scram-sha-256

# backup_user: allowed to connect to all DBs for pg_dump backup jobs (local cron)
host    all                 backup_user     127.0.0.1/32         scram-sha-256

# Postgres superuser: local TCP access for admin tasks (psql -h 127.0.0.1)
host    all                 postgres        127.0.0.1/32         scram-sha-256

# IPv6 loopback — same rules mirrored (in case IPv6 is active on Server 2)
host    thinkvelocity_prod  app_consumer    ::1/128              scram-sha-256
host    thinkvelocity_prod  app_readonly    ::1/128              scram-sha-256
host    enterprise          app_enterprise  ::1/128              scram-sha-256
host    thinkvelocity_ext   app_extension   ::1/128              scram-sha-256
host    all                 backup_user     ::1/128              scram-sha-256
host    all                 postgres        ::1/128              scram-sha-256

# ------------------------------------------------------------------------------
# WIREGUARD VPN CONNECTIONS (10.100.0.0/24)
# All inter-server traffic travels over the WireGuard VPN tunnel.
# SSL (hostssl) is REQUIRED for all WireGuard connections as a defence-in-depth
# measure (even though WireGuard itself is encrypted).
# scram-sha-256 is required for all password-based auth.
# ------------------------------------------------------------------------------

# Server 1 (10.100.0.2): app_extension connects to thinkvelocity_ext
# Extension API on Server 1 → thinkvelocity_ext database
hostssl thinkvelocity_ext   app_extension   10.100.0.2/32        scram-sha-256

# Server 3 (10.100.0.3): app_enterprise connects to enterprise database
# NestJS enterprise backend on Server 3 → enterprise database
hostssl enterprise          app_enterprise  10.100.0.3/32        scram-sha-256

# Server 3 (10.100.0.3): app_consumer for Prompt Enhance service
# Python Prompt Enhance on Server 3 → thinkvelocity_prod (reads user context)
hostssl thinkvelocity_prod  app_consumer    10.100.0.3/32        scram-sha-256

# backup_user: allowed from any WireGuard node (backup jobs may run cross-server)
hostssl all                 backup_user     10.100.0.0/24        scram-sha-256

# Postgres superuser: admin access over WireGuard (for maintenance only)
hostssl all                 postgres        10.100.0.0/24        scram-sha-256

# ------------------------------------------------------------------------------
# CATCH-ALL REJECT
# Deny any connection that did not match a rule above.
# This is the final safety net — 0.0.0.0/0 open rules have been REMOVED.
# ------------------------------------------------------------------------------
host    all                 all             0.0.0.0/0            reject
hostssl all                 all             0.0.0.0/0            reject
