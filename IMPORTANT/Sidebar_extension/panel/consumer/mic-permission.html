<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Velocity – Microphone access</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101010;
      color: #bac9cc;
      font-family: "DM Sans", "Inter", "Segoe UI", Roboto, sans-serif;
    }
    .card {
      max-width: 420px;
      width: 90%;
      padding: 40px 32px;
      border-radius: 20px;
      background: #181818;
      border: 1px solid rgba(25, 216, 230, 0.15);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .mic-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(25, 216, 230, 0.08);
      border: 2px solid rgba(25, 216, 230, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #19d8e6;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #ffffff;
    }
    p {
      font-size: 14px;
      color: #bac9cc;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 32px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #19d8e6 0%, #0d9488 100%);
      color: #101010;
      box-shadow: 0 4px 20px rgba(25, 216, 230, 0.35);
    }
    .btn-primary:hover {
      box-shadow: 0 6px 28px rgba(25, 216, 230, 0.45);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      margin-top: 16px;
      font-size: 13px;
      min-height: 20px;
    }
    .status.success { color: #4ade80; }
    .status.error { color: #ff6b6b; }
    .status.info { color: #19d8e6; }
    .closing-note {
      margin-top: 12px;
      font-size: 12px;
      color: rgba(186, 201, 204, 0.55);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mic-icon">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </div>
    <h1>Enable microphone</h1>
    <p>
      Chrome may not show a reliable mic prompt inside the sidebar. Grant access once on this page, then use voice in the sidebar.
      Click below and choose <strong>Allow</strong> when Chrome asks.
    </p>
    <button type="button" class="btn btn-primary" id="allowBtn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
      Allow microphone
    </button>
    <p class="status" id="status"></p>
    <p class="closing-note" id="closingNote"></p>
  </div>
  <script src="mic-permission.js"></script>
</body>
</html>
